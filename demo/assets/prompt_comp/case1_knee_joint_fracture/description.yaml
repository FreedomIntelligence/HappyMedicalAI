# 案例一：踝关节骨折分析
title: "案例一：骨科图片对比分析"
description: "给定踝关节骨折的X光片，结合病人陈述进行分析"
# image_path: "assets/prompt_comp/case1_knee_joint_fracture/knee_joint_ct_2d_3d_fracture.png"
images:
  - path: "assets/prompt_comp/case1_knee_joint_fracture/knee_joint_ct_2d_3d_fracture.png"
    caption: "膝关节CT成像"

prompts:
  "零、Basic without strategy":
    prompt: "请先完成病例分析与相关诊断和治疗建议。"
    response: "根据X光片显示，患者存在踝关节骨折。建议进行复位固定，避免负重，定期复查。疼痛明显时可服用止痛药缓解症状。"
    evaluation: "Basic模式回答过于简单，缺乏专业深度和详细信息。"

  "一、Expert prompt":
    prompt: |
      你是一名经验丰富的骨科主任医师。
      我将提供患者的影像学资料与病历摘要，请你：
      1. 分析骨折/病灶部位与类型；
      2. 给出诊断考虑（需说明常见诊断与鉴别诊断）；
      3. 提供治疗思路（非处方，强调手术方式/康复建议）；
      4. 参考 AAOS 或国内指南，说明推荐依据；
      5. 如有不确定性，请明确提示并指出需进一步检查。
    response: |
      作为骨科主任医师，我的分析如下：
      1. 骨折部位为踝关节内踝，属于旋后外旋型骨折（Lauge-Hansen分型）。
      2. 诊断考虑为踝关节内踝骨折，需与踝关节扭伤、外踝骨折相鉴别。
      3. 治疗思路：该骨折移位明显，建议行切开复位内固定术，术后早期进行功能锻炼。
      4. 推荐依据：根据AAOS踝关节骨折治疗指南，此类移位骨折手术治疗可获得更好的解剖复位和预后。
      5. 不确定性：需进一步检查排除韧带损伤，建议术前进行MRI检查。
    evaluation: "Expert prompt回答专业全面，符合临床实践，参考指南增加了可信度。"

  "二、Reflective":
    prompt: |
      请先完成病例分析。然后反思：
      - 哪些结论有充分证据？
      - 哪些是推测？
      - 有无常见遗漏（半月板/韧带损伤）？
      - 指南引用是否到位？
      最后请基于反思给出改进版答案。
    response: |
      初步分析：患者存在踝关节内踝骨折，建议手术治疗。
      反思：
      - 有充分证据的结论：内踝骨折诊断明确（X光片显示）。
      - 推测：可能存在三角韧带损伤，但尚未证实。
      - 可能遗漏：未详细评估软组织情况。
      - 指南引用基本到位，但可更具体。
      改进版答案：患者存在踝关节内踝骨折（旋后外旋型），根据X光片显示移位明显。建议术前进行MRI检查评估韧带损伤情况，行切开复位内固定术。术后处理遵循AAOS指南，术后24小时开始进行趾屈活动，48-72小时开始踝泵练习，逐步增加活动度。
    evaluation: "Reflective模式通过反思提高了回答的准确性，指出了潜在遗漏。"

  "三、chain-of-thought":
    prompt: |
      请一步步推理：
      Step 1: 受伤机制可能是什么？
      Step 2: 哪个解剖部位受累？
      Step 3: 对应的骨折分型是什么？
      Step 4: 可能的合并伤有哪些？
      Step 5: 哪些情况提示必须手术？
      Step 6: 如果手术，哪种入路与固定方式更合适？
      Step 7: 如果不手术，可能会发生哪些并发症？
      最后，请总结并给出清晰的治疗推荐。
    response: |
      Step 1: 受伤机制可能为足部旋后位时受到外翻暴力。
      Step 2: 主要受累解剖部位为内踝，可能累及踝关节内侧韧带复合体。
      Step 3: 对应的骨折分型为Lauge-Hansen旋后外旋型II度。
      Step 4: 可能的合并伤包括三角韧带损伤、下胫腓联合分离。
      Step 5: 骨折移位超过2mm、关节面不平整提示必须手术。
      Step 6: 如果手术，采用内侧入路，使用拉力螺钉固定更合适。
      Step 7: 如果不手术，可能会发生骨折不愈合、畸形愈合、创伤性关节炎等并发症。
      总结：建议行切开复位内固定术，采用内侧入路，拉力螺钉固定。术后早期功能锻炼，定期复查。
    evaluation: "chain-of-thought逻辑清晰，步骤明确，有利于理解诊断思路。"

  "四、tree-of-thought":
    prompt: |
      针对该病例，请从不同角度分支分析：
      1. 如果保守治疗 → 适应证？风险？预后？
      2. 如果切开复位+内固定 → 手术入路？植骨需求？并发症？
      3. 如果关节镜辅助 → 优势？局限性？适用患者？
      请对比三条路径，并选择最优推荐，同时说明为什么舍弃其他方案。
    response: |
      1. 如果保守治疗：
         - 适应证：无移位的稳定骨折
         - 风险：骨折再移位、愈合不良
         - 预后：可能出现关节功能受限

      2. 如果切开复位+内固定：
         - 手术入路：内侧入路
         - 植骨需求：目前骨折端无明显骨缺损，暂不需要植骨
         - 并发症：伤口感染、神经损伤风险

      3. 如果关节镜辅助：
         - 优势：创伤小，可同时处理关节内其他损伤
         - 局限性：对于此类移位骨折复位难度大
         - 适用患者：无明显移位的简单骨折

      最优推荐：选择切开复位+内固定。理由是该患者骨折移位明显，保守治疗难以达到满意复位，而关节镜辅助对于此类骨折操作难度大。切开复位可获得解剖复位，有利于关节功能恢复。
    evaluation: "tree-of-thought从多角度分析，对比不同治疗方案，推荐理由充分。"
  "五、few-shot":
    prompt: |
      <开始>患者性别：男 患者年龄：20岁 主诉：左胫腓骨骨折术后2月余。 简要病史： 2月前因“左胫腓骨开放性骨折”在我院行清创，骨折复位外固定架固定术。现伤口愈合，为求更换内固定，来院。 辅助检查： img <结束>指令：学习以上样例，输出类似输出，分析第二张图片所给出的例子
    answer: |
      <开始>
      患者性别：男
      患者年龄：34岁
      主诉：左膝关节疼痛、活动受限1周余。
      简要病史：
      1周前因摔伤左膝，出现关节疼痛、活动障碍。外院初步处理后转入我院进一步诊治。
      辅助检查：
      - X线及CT三维重建提示：左胫骨平台骨折（Schatzker Ⅱ型可能性大，表现为外侧平台劈裂合并下陷），伴局部关节面塌陷及轻度移位。
      - 关节间隙未见明显狭窄，髁间嵴可见受累，髌骨对位尚可。
      - 未见明显游离骨块进入关节腔。
      - 腓骨小头及腓骨近端未见明显骨折征象。
      初步诊断：
      左胫骨平台骨折（Schatzker Ⅱ型，外侧平台劈裂伴关节面塌陷）。
      诊疗考虑：
      1. 保守治疗：仅适用于塌陷<5mm、移位<2mm且关节稳定者，本例因关节面塌陷明显，不推荐。
      2. 手术治疗：
        - 建议行切开复位+内固定（常用L形或弧形小切口，钢板螺钉固定）。
        - 必要时同种异体骨或人工骨植骨以支撑关节面。
        - 同时术中需评估半月板、交叉韧带等软组织损伤。
      3. 术后康复：早期 CPM 功能锻炼，避免负重6-8周，逐步增加负荷。
      <结束>
      要不要我帮你也做一个与第一个病例相同结构的完整病历报告格式（带“来院目的”“治疗经过”“反思分析”模块），方便你对比学习？
    evaluation: |
      few-shot有助于AI快速学习模仿专业实际的医师诊疗结果，便于学习模仿专业逻辑、规范格式等实现。
